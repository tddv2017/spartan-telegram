# Spartan Institutional Asset Universe Configurations
# Microstructure dimensions and exchange trading rules

assets:
  XAUUSD:
    asset_class: "metals"
    asset_code: 1
    contract_size: 100.0 # 100 Troy oz
    tick_size: 0.01
    tick_value: 1.0 # $1.00 per tick per 1 lot ($100 per $1 move)
    pip_size: 0.1
    pip_value: 10.0
    min_lot: 0.01
    max_lot: 50.0
    lot_step: 0.01
    base_currency: "XAU"
    quote_currency: "USD"
    margin_currency: "USD"
    leverage: 100.0
    baseline_spread: 0.20 # $0.20 (2.0 pips)
    max_spread_multiplier: 3.5
    stop_loss_atr_mult: 3.0
    trading_schedule: "23/5"
    trading_sessions:
      london_ny_overlap: ["12:00", "17:00"]
    commission_per_lot: 5.0 # Round-turn commission USD

