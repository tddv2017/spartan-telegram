# Spartan Institutional Multi-Tier Risk Governance Configuration

capital:
  default_initial_equity: 100000.0 # $100,000 baseline
  currency: "USD"

position_sizing:
  method: "fractional_kelly"
  kelly_scaling_factor: 0.0125 # 1/25th fractional Kelly
  min_risk_per_trade: 0.0025 # 0.25%
  max_risk_per_trade: 0.0050 # 0.50%
  max_margin_per_trade_pct: 0.10 # Max 10% of free margin per position

drawdown_governor:
  max_drawdown_limit: 0.050 # 5.0% absolute ceiling
  tiers:
    tier_1_normal:
      max_dd: 0.030 # 0% - 3.0%
      risk_multiplier: 1.0
      allow_new_trades: true
      action: "NORMAL_OPERATION"
    tier_2_soft_throttle:
      min_dd: 0.030
      max_dd: 0.045 # 3.0% - 4.5%
      risk_multiplier: 0.5 # Halve risk (0.125% - 0.25%)
      allow_new_trades: true
      tighten_trailing_stops_pct: 0.30
      action: "SOFT_THROTTLE"
    tier_3_hard_freeze:
      min_dd: 0.045
      max_dd: 0.050 # 4.5% - 5.0%
      risk_multiplier: 0.0
      allow_new_trades: false
      lock_breakeven: true
      action: "HARD_FREEZE"
    tier_4_circuit_breaker:
      min_dd: 0.050 # >= 5.0%
      risk_multiplier: 0.0
      allow_new_trades: false
      emergency_flatten: true
      action: "CIRCUIT_BREAKER_KILL_SWITCH"
  hysteresis_recovery_dd: 0.015 # Must recover to < 1.5% DD to return to Tier 1

circuit_breakers:
  stop_out_ltv:
    max_margin_utilization: 0.85 # 85% LTV (Margin Level <= 117.65%)
    target_recovery_utilization: 0.50 # Liquidate highest margin burden until < 50%
    critical_cushion_pct: 0.20 # If broker stop-out cushion < 20%, instant market-flatten
  latency_tripwire:
    max_latency_ms: 1500
    max_consecutive_timeouts: 3
    halt_duration_minutes: 15
  spread_tripwire:
    max_spread_multiplier: 3.5 # Spread > 3.5x EMA(100) blocks new orders
    cooling_bars: 3
  remote_kill_switch:
    rtdb_path: "system_config.globalBotActive"
    poll_interval_seconds: 5
